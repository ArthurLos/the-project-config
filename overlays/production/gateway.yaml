# Attaches to the shared Gateway (my-gateway, exercises namespace) that lives in
# the application-code repo's manifests/gateway.yaml - see that repo's root
# README "Local cluster note" for why one Gateway is shared across apps.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: production-route
spec:
  parentRefs:
    - name: my-gateway
      namespace: exercises
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /todos
      backendRefs:
        - name: todo-backend-svc
          port: 2345
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todo-app-svc
          port: 3000
