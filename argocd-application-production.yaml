# Exercise 4.10: production environment. Applied once, manually:
#
#   kubectl apply -f argocd-application-production.yaml
#
# Deliberately tracks this repo's own "production" branch, not main, and not
# the course-exercise tags of the separate application-code repository
# (https://github.com/ArthurLos/devops-with-kubernetes-2026, the_project/
# folder - see this repo's README for the code/config split). Instead:
# .github/workflows/promote-production.yml (in THIS repo) auto-triggers on any
# push of a v* tag (this repo's own release convention, e.g. v1.0.0) and
# fast-forwards the production branch to that exact commit - entirely local
# git operations, no cloud credentials needed. ArgoCD then picks up the moved
# branch on its own, same automated-sync mechanism as every other Application
# here. That chain is "each tagged commit results in deployment to the
# production environment" (exercise 4.9), now scoped to this configuration
# repository specifically (exercise 4.10's whole point).
#
# Secrets (postgres-credentials, broadcaster-webhook) are applied by hand in
# the production namespace ahead of time, per exercise 4.9 - never part of
# this sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ArthurLos/the-project-config.git
    targetRevision: production
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
